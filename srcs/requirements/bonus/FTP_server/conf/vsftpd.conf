listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

local_umask=022

chroot_local_user=YES
allow_writeable_chroot=YES

user_sub_token=$USER
local_root=/var/www/html

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40010

seccomp_sandbox=NO

pam_service_name=vsftpd

xferlog_enable=YES